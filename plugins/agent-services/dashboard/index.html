<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agent-services savings page</title>
<style>
:root {
  --bg: #f6f5f1;
  --surface: #ffffff;
  --surface-2: #f1efe9;
  --border: #e4e1d8;
  --text: #1d1c19;
  --muted: #6b675e;
  --faint: #9a958a;
  --accent: #1f7a5a;
  --accent-soft: #e2f1ea;
  --accent-ink: #145a41;
  --bar: #2f9a72;
  --bar-neg: #c4673d;
  --grid: #ebe8e0;
  --warn: #a5621c;
  --warn-soft: #f8ecdc;
  --bad: #b23b3b;
  --bad-soft: #f7e3e1;
  --off: #8e8a80;
  --locked: #c9c5bb;
  --gold: #b68a1e;
  --gold-soft: #f6eed5;
  --shadow: 0 1px 2px rgba(30, 28, 22, 0.05), 0 4px 16px rgba(30, 28, 22, 0.04);
  --radius: 14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141412;
    --surface: #1d1c1a;
    --surface-2: #252421;
    --border: #33312d;
    --text: #efede7;
    --muted: #a8a397;
    --faint: #7a766c;
    --accent: #4cc596;
    --accent-soft: #1c3229;
    --accent-ink: #7fdcb6;
    --bar: #43b688;
    --bar-neg: #e08a5f;
    --grid: #2b2a26;
    --warn: #e0a65a;
    --warn-soft: #362a1a;
    --bad: #e57b74;
    --bad-soft: #3a2220;
    --off: #8a867c;
    --locked: #4a4842;
    --gold: #e2bd57;
    --gold-soft: #352d17;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 16px rgba(0, 0, 0, 0.2);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141412;
  --surface: #1d1c1a;
  --surface-2: #252421;
  --border: #33312d;
  --text: #efede7;
  --muted: #a8a397;
  --faint: #7a766c;
  --accent: #4cc596;
  --accent-soft: #1c3229;
  --accent-ink: #7fdcb6;
  --bar: #43b688;
  --bar-neg: #e08a5f;
  --grid: #2b2a26;
  --warn: #e0a65a;
  --warn-soft: #362a1a;
  --bad: #e57b74;
  --bad-soft: #3a2220;
  --off: #8a867c;
  --locked: #4a4842;
  --gold: #e2bd57;
  --gold-soft: #352d17;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 16px rgba(0, 0, 0, 0.2);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
.wrap { max-width: 1040px; margin: 0 auto; padding: 28px 16px 56px; }
.num { font-variant-numeric: tabular-nums; }
header.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 650; letter-spacing: -0.01em; font-size: 16px; }
.brand svg { flex: none; }
.meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; color: var(--muted); font-size: 13px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--border); font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.pill strong { color: var(--text); font-weight: 600; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; min-width: 0; }
.hero { padding: 28px 24px; position: relative; overflow: hidden; }
.hero::after { content: ""; position: absolute; right: -80px; top: -80px; width: 260px; height: 260px; border-radius: 50%; background: radial-gradient(closest-side, var(--accent-soft), transparent); pointer-events: none; }
.eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; margin: 0 0 6px; }
.hero-value { font-size: clamp(40px, 9vw, 64px); font-weight: 700; letter-spacing: -0.03em; line-height: 1.05; margin: 0; }
.hero-sub { margin: 10px 0 0; color: var(--muted); font-size: 16px; max-width: 46ch; }
.hero-sub strong { color: var(--accent-ink); font-weight: 650; }
.tag { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; padding: 2px 8px; border-radius: 6px; vertical-align: middle; }
.tag.est { background: var(--warn-soft); color: var(--warn); }
.tag.meas { background: var(--accent-soft); color: var(--accent-ink); }
.hero-stats { display: flex; flex-wrap: wrap; gap: 10px 28px; margin-top: 20px; position: relative; z-index: 1; }
.hero-stat .k { font-size: 12.5px; color: var(--muted); }
.hero-stat .v { font-size: 20px; font-weight: 650; letter-spacing: -0.01em; }
.grid { display: grid; gap: 16px; margin-top: 16px; }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (max-width: 900px) { .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 620px) { .g4, .g2 { grid-template-columns: minmax(0, 1fr); } .hero { padding: 22px 18px; } .card { padding: 16px; } }
h2 { font-size: 15px; font-weight: 650; margin: 0; letter-spacing: -0.005em; }
.card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.card-head .hint { color: var(--muted); font-size: 12.5px; }
.benefit .icon { width: 34px; height: 34px; border-radius: 10px; background: var(--accent-soft); color: var(--accent-ink); display: grid; place-items: center; margin-bottom: 12px; }
.benefit .big { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; margin-top: 4px; }
.benefit .unit { font-size: 13px; color: var(--muted); margin-left: 4px; font-weight: 500; letter-spacing: 0; }
.benefit .line { color: var(--muted); font-size: 13px; margin-top: 6px; }
.benefit .line strong { color: var(--text); font-weight: 600; }
.benefit .save { margin-top: 10px; font-size: 14px; font-weight: 600; color: var(--accent-ink); }
.benefit .save.none { color: var(--faint); font-weight: 500; }
details.how { margin-top: 12px; border-top: 1px dashed var(--border); padding-top: 8px; }
details.how summary { cursor: pointer; color: var(--muted); font-size: 12.5px; list-style: none; display: inline-flex; align-items: center; gap: 6px; user-select: none; }
details.how summary::-webkit-details-marker { display: none; }
details.how summary::before { content: "+"; display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: 50%; border: 1px solid var(--border); font-size: 11px; line-height: 1; }
details.how[open] summary::before { content: "\2212"; }
details.how summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
details.how p { margin: 8px 0 0; font-size: 13px; color: var(--muted); }
.chart-box { width: 100%; }
.chart-box svg { display: block; width: 100%; height: auto; }
.chart-empty { color: var(--muted); font-size: 14px; padding: 28px 0; text-align: center; }
.chart-readout { font-size: 13px; color: var(--muted); min-height: 20px; margin-top: 6px; }
.chart-readout strong { color: var(--text); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface-2); font-size: 13px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--off); flex: none; }
.chip.ok .dot { background: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.chip.warn .dot { background: var(--warn); box-shadow: 0 0 0 3px var(--warn-soft); }
.chip.off { color: var(--muted); }
.chip .st { color: var(--muted); font-size: 12px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; font-size: 14px; margin: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-weight: 600; text-align: right; }
.compare-row { display: flex; align-items: center; gap: 12px; margin: 10px 0; }
.compare-row .lbl { width: 96px; flex: none; font-size: 13px; color: var(--muted); }
.compare-row .track { flex: 1; height: 10px; background: var(--surface-2); border-radius: 999px; overflow: hidden; min-width: 0; }
.compare-row .fill { height: 100%; background: var(--bar); border-radius: 999px; }
.compare-row .fill.peer { background: var(--faint); }
.compare-row .val { width: 64px; flex: none; text-align: right; font-weight: 600; font-size: 14px; }
.delta { font-weight: 650; }
.delta.up { color: var(--accent-ink); }
.delta.down { color: var(--bar-neg); }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.ach-strip { display: grid; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: 12px; }
.ach { border: 1px solid var(--border); border-radius: 12px; padding: 14px 12px; background: var(--surface-2); text-align: center; min-width: 0; }
.ach .medal { width: 44px; height: 44px; margin: 0 auto 8px; border-radius: 50%; display: grid; place-items: center; background: var(--gold-soft); color: var(--gold); }
.ach .name { font-weight: 650; font-size: 13.5px; }
.ach .desc { font-size: 12px; color: var(--muted); margin-top: 4px; }
.ach.locked { opacity: 0.72; }
.ach.locked .medal { background: var(--surface); color: var(--locked); border: 1px dashed var(--locked); }
.ach.locked .name { color: var(--muted); }
.ach .prog { height: 4px; background: var(--surface); border-radius: 999px; margin-top: 10px; overflow: hidden; }
.ach .prog i { display: block; height: 100%; background: var(--faint); }
.section-title { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 32px 0 12px; flex-wrap: wrap; }
.section-title h2 { font-size: 17px; }
footer { margin-top: 36px; color: var(--faint); font-size: 12.5px; text-align: center; }
.empty-note { color: var(--muted); font-size: 14px; margin: 4px 0 0; }
.tl { list-style: none; margin: 0; padding: 0; }
.tl li { display: flex; gap: 14px; align-items: baseline; padding: 9px 0; border-top: 1px solid var(--grid); font-size: 14px; }
.tl li:first-child { border-top: 0; padding-top: 0; }
.tl .when { flex: none; width: 72px; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.tl .what { min-width: 0; overflow-wrap: anywhere; }
.week-lines { margin: 0; padding: 0; list-style: none; }
.week-lines li { margin: 6px 0; font-size: 14.5px; }
.week-lines li:first-child { font-size: 18px; font-weight: 650; margin-top: 0; }
.week-lines li.admin { margin-top: 14px; color: var(--muted); font-size: 13px; }
/* explanations: one rule for every item with data-explain (its text is in EXPLAIN in the script) */
.ex { text-decoration: underline dotted var(--faint); text-underline-offset: 3px; cursor: help; border-radius: 3px; -webkit-tap-highlight-color: transparent; }
.ex:focus { outline: none; }
.ex:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.explain { position: fixed; z-index: 50; left: 0; top: 0; width: max-content; max-width: min(300px, calc(100vw - 24px)); padding: 9px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--text); box-shadow: var(--shadow); font-size: 13px; line-height: 1.45; font-weight: 400; text-align: left; letter-spacing: 0; text-transform: none; pointer-events: none; }
.explain[hidden] { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect width="26" height="26" rx="8" fill="var(--accent)"/><path d="m7 15.5l4 4 8-11" fill="none" stroke="var(--surface)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>agent-services</span>
    </div>
    <div class="meta" id="meta"></div>
  </header>

  <section class="card hero" id="hero" aria-live="polite"></section>

  <div class="section-title"><h2>Today</h2><span class="muted small" id="today-hint"></span></div>
  <section class="card" id="timeline"></section>

  <div class="section-title"><h2>This week</h2><span class="muted small" id="week-hint"></span></div>
  <section class="card" id="weekly"></section>

  <div class="section-title"><h2 id="chart-title">Saved per day (est.)</h2><span class="muted small" id="chart-range"></span></div>
  <section class="card">
    <div class="chart-box" id="chart"></div>
    <div class="chart-readout" id="chart-readout"></div>
    <div id="chart-how"></div>
  </section>

  <div class="section-title"><h2>What it did for you</h2><span class="muted small" id="benefit-hint"></span></div>
  <section class="grid g4" id="benefits"></section>

  <section class="grid g2">
    <div class="card" id="compare"></div>
    <div class="card" id="guidance"></div>
  </section>

  <div class="section-title"><h2>Achievements</h2><span class="muted small" id="ach-count"></span></div>
  <section class="card"><div class="ach-strip" id="achievements"></div></section>

  <div class="section-title"><h2>Services</h2><span class="muted small" id="svc-hint"></span></div>
  <section class="card"><div class="chips" id="services"></div><div id="svc-how"></div></section>

  <footer id="footer"></footer>
</div>
<div class="explain" id="explain" role="tooltip" hidden></div>

<script type="application/json" id="data">null</script>
<script>
(function () {
  "use strict";
  var SVG_NS = "http://www.w3.org/2000/svg";
  var shown = null;
  try { shown = JSON.parse(document.getElementById("data").textContent || "null"); } catch (e) { shown = null; }
  var pristine = document.querySelector(".wrap").cloneNode(true); // the empty page, drawn again for newer figures

  // ---------------------------------------------------------------- helpers (DOM only, no HTML strings)
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) { n.className = cls; }
    if (text !== undefined && text !== null) { n.textContent = String(text); }
    return n;
  }
  function add(parent) {
    for (var i = 1; i < arguments.length; i++) {
      var c = arguments[i];
      if (c === null || c === undefined || c === false) { continue; }
      parent.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    }
    return parent;
  }
  function svg(tag, attrs) {
    var n = document.createElementNS(SVG_NS, tag);
    for (var k in attrs) { if (Object.prototype.hasOwnProperty.call(attrs, k)) { n.setAttribute(k, String(attrs[k])); } }
    return n;
  }
  function isNum(v) { return typeof v === "number" && isFinite(v); }
  function money(v) {
    if (!isNum(v)) { return "—"; }
    var a = Math.abs(v);
    var digits = a >= 100 || (a >= 10 && a === Math.round(a)) ? 0 : 2;
    var s = a.toLocaleString("en-US", { minimumFractionDigits: digits, maximumFractionDigits: digits });
    return (v < 0 ? "−$" : "$") + s;
  }
  function count(v) { return isNum(v) ? Math.round(v).toLocaleString("en-US") : "—"; }
  function pct(v) { return isNum(v) ? (v * 100).toFixed(Math.abs(v) < 0.1 ? 1 : 0) + "%" : "—"; }
  function peerPct(v) { return isNum(v) ? v.toFixed(1) + "%" : "—"; }
  function fmtDay(s, long) {
    if (typeof s !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(s)) { return "—"; }
    var p = s.split("-");
    var d = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2]));
    var o = long ? { year: "numeric", month: "long", day: "numeric", timeZone: "UTC" } : { month: "short", day: "numeric", timeZone: "UTC" };
    return d.toLocaleDateString("en-US", o);
  }
  function addDays(s, n) {
    var p = s.split("-");
    var d = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2] + n));
    return d.toISOString().slice(0, 10);
  }
  function how(text, measured) {
    var d = el("details", "how");
    var s = el("summary", null, "How this is measured");
    var p = el("p");
    add(p, el("span", "tag " + (measured ? "meas" : "est"), measured ? "Measured" : "Estimated"), " ", text);
    add(d, s, p);
    return d;
  }
  function icon(path) {
    var s = svg("svg", { width: 18, height: 18, viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", "stroke-width": 2, "stroke-linecap": "round", "stroke-linejoin": "round", "aria-hidden": "true" });
    path.split("|").forEach(function (d) { s.appendChild(svg("path", { d: d })); });
    return s;
  }

  // ---------------------------------------------------------------- explanations: one map, one mechanism
  // An item a person may wonder about carries data-explain="<key>" (explainable below) and its text is in EXPLAIN,
  // once. Each text says what is counted, what it is compared with, over which period, and that savings are estimates.
  var EXPLAIN = {
    "today-day": "The local day these lines cover: from midnight to now, on this computer's clock.",
    "today-summary": "Counted on this computer since midnight: model replies from subagents that ran on a cheaper model, and memory cleanups (compactions). Replies, not tasks.",
    "tl-cheaper": "The router decided that a subagent should run on a cheaper model. Lines in the same clock hour are grouped, and the number is how many decisions there were.",
    "tl-model": "The router decided that a subagent should run on a model no cheaper than a top-tier one. No saving is counted for those runs.",
    "tl-cleanup": "Our checkpoint advice said this was a good moment for a memory cleanup: compacting a long conversation to free up its context.",
    "tl-tips": "Working guidance was fetched from our service for one of your sessions.",
    "tl-upload": "The day's usage counts (totals and counts, no text from your work) were sent to our service for your savings figures.",
    "tl-board": "A new version of your savings page was published to your private Artifact.",
    "week-range": "The seven days the lines below cover: today and the six days before it.",
    "wk-saved": "Your measured savings for the last seven days, today included: each day's routing, compaction and indexed-read savings added up. An estimate, not a bill.",
    "wk-cleanups": "The same seven-day total as the line above. It is negative when the compactions cost more than the other savings added up.",
    "wk-change": "The seven-day total above minus the total for the seven days before. Shown only when both periods have measured days.",
    "wk-best": "The day with the largest measured saving in the last seven days. Shown when at least two days had a measured saving.",
    "wk-lever": "Of the kinds of saving (for example routing or compaction), the one that added the most over the last seven days.",
    "wk-peer": "Your measured savings as a share of what the same work would have cost. The other figure is the median share of all other users who share usage, over their last 30 days.",
    "usage-tokens": "Tokens your sessions used and what that use would cost at API prices, for the week, the month and all time. Covers all your devices when our service has their figures.",
    "usage-quota": "Week and 5-hour: share of your Claude usage limit used, and when it resets (as Claude Code reports it). Context: how full the current conversation is. Saved (est.): total measured savings.",
    "usage-spent": "Your own time at the keyboard so far, estimated from the bytes you typed at a fixed typing speed (200 bytes a minute by default). Total so far, not only this week.",
    "usage-agent": "Clock time with at least one agent working, so far. Gaps longer than the idle limit (10 minutes by default) count as idle; agents running at once count once. Total so far.",
    "usage-concurrent": "Time saved by running agents side by side: their combined run time minus the clock time they covered. Total so far.",
    "benefit-since": "The first day with measured savings. The savings figures in this section count from that day.",
    "route-count": "Model replies from subagents that ran on the model the router chose for them. Replies, not tasks. The larger of this computer's count and our service's count is shown.",
    "route-save": "Estimated saving on those replies: the same replies on a top-tier model (or the main conversation's model when that is cheaper), minus what they cost, at API prices.",
    "comp-count": "Compactions of a long conversation at a checkpoint, counted when each one starts. The larger of this computer's count and our service's count is shown.",
    "comp-save": "Estimated saving from compactions: the full conversation's cost carried forward, less the summary and the shorter conversation. One that cost more counts against the total.",
    "idx-count": "Reads of part of a file found through the project index, instead of reading the whole file. The larger of this computer's count and our service's count is shown.",
    "idx-save": "Estimated saving from those partial reads: each one is taken to skip half of its file, priced at the model's input rate.",
    "guard-count": "Risky commands the command guard stopped, as recorded on this computer.",
    "guard-save": "A stopped command has no dollar figure, so no saving is shown for it.",
    "chart-title": "Estimated dollars saved on each day: routing, compaction and indexed-read savings added up. A bar below zero means that day's compactions cost more than its other savings.",
    "chart-range": "The first and last day of the bars: between 7 and 30 days, ending today.",
    "ach-routed-1": "Earned by your first subagent reply that ran on the model the router chose. Counts the routing figure above, which counts replies.",
    "ach-dollar-1": "Earned once total measured savings reach $1.",
    "ach-dollar-10": "Earned once total measured savings reach $10.",
    "ach-dollar-100": "Earned once total measured savings reach $100.",
    "ach-routed-10": "Earned when the routing figure above reaches 10 (replies, not tasks).",
    "ach-routed-100": "Earned when the routing figure above reaches 100 (replies, not tasks).",
    "ach-routed-1000": "Earned when the routing figure above reaches 1,000 (replies, not tasks).",
    "ach-streak": "Earned after 7 active days in a row. A day counts when this computer recorded a routed reply, compaction or indexed read, or your measured savings include that day.",
    "ach-guard": "Earned when the command guard stops a risky command and the stop is recorded here.",
    "ach-count": "Achievements unlocked so far, out of those listed below.",
    "svc-health": "A check that our service answers, sent without signing in. When this switch is off, the check is not made.",
    "svc-updates": "Checks for a newer plugin version (it never updates itself) and fetches working guidance and toolbox packs from our service. When off, none of these requests are sent.",
    "svc-incidents": "Off by default. When on, error reports may be sent to our service so that common problems can be grouped and fixed.",
    "svc-metrics": "Sends usage counts (totals and counts, no text from your work) to our service for your savings figures. Your savings record choice must also be on.",

        var w = el("dl", "kv");
        w.style.marginTop = "14px";
        add(w, el("dt", null, "Last 7 days"), el("dd", "num", money(cmp.this_week_usd)));
        add(w, el("dt", null, "The 7 days before"), el("dd", "num", isNum(cmp.last_week_usd) ? money(cmp.last_week_usd) : "—"));
        c.appendChild(w);
        if (isNum(cmp.week_change)) {
          var q = el("p", "small");
          var up = cmp.week_change >= 0;
          add(q, "vs last week: ", el("span", "delta " + (up ? "up" : "down"), (up ? "+" : "−") + pct(Math.abs(cmp.week_change))));
          c.appendChild(q);
        }
      }
      if (!any) {
        c.appendChild(el("p", "empty-note", "Comparisons appear after a week of measured savings, and the peer comparison once enough other users share their usage."));
      }
      var peers = isNum(cmp.peers) ? " from " + count(cmp.peers) + " similar users" : "";
      c.appendChild(how("The peer figure is the median share saved over the last 30 days" + peers + ", worked out by our service from shared usage counts only. " +
        "The weekly figures add up your measured daily savings for the last 7 days and the 7 days before.", true));
    })();

    // ---------------------------------------------------------------- served guidance
    (function guidance() {
      var c = document.getElementById("guidance");
      var gd = D.guidance;
      var head = el("div", "card-head"); add(head, el("h2", null, "Working guidance"));
      if (gd && gd.channel) { head.appendChild(el("span", "pill", gd.channel === "beta" ? "Early access" : "Stable")); }
      c.appendChild(head);
      if (gd) {
        var names = { plugin: "Guidance for your sessions", auto: "Guidance for unattended sessions", control: "Guidance for planning sessions" };
        add(c, el("p", "small muted", (names[gd.role] || "Guidance in use") + ", kept up to date for you."));
        var kv = el("dl", "kv");
        if (gd.version) { add(kv, el("dt", null, "Version"), el("dd", "num", gd.version)); }
        if (isNum(gd.items)) { add(kv, el("dt", null, "Practices in use"), el("dd", "num", count(gd.items))); }
        if (gd.last_used) { add(kv, el("dt", null, "Last used"), el("dd", null, fmtDay(gd.last_used, true))); }
        c.appendChild(kv);
      } else {
        c.appendChild(el("p", "empty-note", "Tested working practices are delivered to your sessions as they start. The version in use shows here after the first one."));
      }
      c.appendChild(how("Shows the guidance version your latest session received and how many practices it holds, read on this computer. The guidance text itself is never stored.", true));
    })();

    // ---------------------------------------------------------------- achievements
    (function achievements() {
      var box = document.getElementById("achievements");
      var usd = measured ? sav.usd : 0;
      var routed = isNum(routedTotal) ? routedTotal : 0;
      var streak = act && isNum(act.streak_days) ? act.streak_days : 0;
      var blocked = guard && isNum(guard.all_time) ? guard.all_time : 0;
      var list = [
        { ex: "ach-routed-1", name: "First routed task", got: routed >= 1, desc: "A task ran on a better-fit model", lock: "Unlocks when a subagent task is routed", have: routed, need: 1, icon: "m4 12h10|m10 6l6 6-6 6" },
        { ex: "ach-dollar-1", name: "First dollar", got: usd >= 1, desc: "$1 saved", lock: "Unlocks at $1 saved", have: usd, need: 1, icon: "m12 3v18|m16 7H10a3 3 0 000 6h4a3 3 0 010 6H7" },
        { ex: "ach-dollar-10", name: "Ten dollars", got: usd >= 10, desc: "$10 saved", lock: "Unlocks at $10 saved", have: usd, need: 10, icon: "m12 3v18|m16 7H10a3 3 0 000 6h4a3 3 0 010 6H7" },
        { ex: "ach-dollar-100", name: "Hundred dollars", got: usd >= 100, desc: "$100 saved", lock: "Unlocks at $100 saved", have: usd, need: 100, icon: "m12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.5 6.7 19.4l1.2-6L3.4 9.3l6-.7z" },
        { ex: "ach-routed-10", name: "Ten routed", got: routed >= 10, desc: "10 tasks routed", lock: "Unlocks at 10 routed tasks", have: routed, need: 10, icon: "m4 7h10|m4 12h13|m4 17h16" },
        { ex: "ach-routed-100", name: "Hundred routed", got: routed >= 100, desc: "100 tasks routed", lock: "Unlocks at 100 routed tasks", have: routed, need: 100, icon: "m4 7h10|m4 12h13|m4 17h16" },
        { ex: "ach-routed-1000", name: "Thousand routed", got: routed >= 1000, desc: "1,000 tasks routed", lock: "Unlocks at 1,000 routed tasks", have: routed, need: 1000, icon: "m4 7h10|m4 12h13|m4 17h16" },
        { ex: "ach-streak", name: "Week streak", got: streak >= 7, desc: "Active 7 days in a row", lock: "Unlocks after 7 active days in a row", have: streak, need: 7, icon: "m12 3c3 4 5 6 5 10a5 5 0 01-10 0c0-2 1-3.5 2-4.5 0 2 1 3 2 3 0-3 0-5 1-8.5z" },
        { ex: "ach-guard", name: "Close call", got: blocked >= 1, desc: "A risky command was stopped", lock: "Unlocks when the guard stops a risky command", have: blocked, need: 1, icon: "m12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z" }
      ];
      if (!guard) list = list.filter(function (a) { return a.ex !== "ach-guard"; });
      var got = 0;
      list.forEach(function (a) {
        var c = explainable(el("div", "ach" + (a.got ? "" : " locked")), a.ex);
        var m = el("div", "medal"); m.appendChild(icon(a.got ? a.icon : "m7 11V8a5 5 0 0110 0v3|m5 11h14v10H5z")); c.appendChild(m);
        add(c, el("div", "name", a.name), el("div", "desc", a.got ? a.desc : a.lock));
        if (!a.got && a.need > 1) {
          var pr = el("div", "prog"), bar = el("i");
          bar.style.width = Math.max(0, Math.min(100, a.have / a.need * 100)) + "%";
          pr.appendChild(bar);
          pr.setAttribute("role", "progressbar");
          pr.setAttribute("aria-valuemin", "0"); pr.setAttribute("aria-valuemax", String(a.need)); pr.setAttribute("aria-valuenow", String(Math.min(a.need, Math.round(a.have))));
          c.appendChild(pr);
        }
        if (a.got) { got++; }
        box.appendChild(c);
      });
      var ac = document.getElementById("ach-count"); ac.textContent = got + " of " + list.length + " unlocked"; explainable(ac, "ach-count");
    })();

    // ---------------------------------------------------------------- services
    (function services() {
      var c = document.getElementById("services");
      var sv = D.services;
      var names = { health: "Health checks", updates: "Updates", incidents: "Problem reports", metrics: "Usage sharing",
        router: "Model routing", checkpoint: "Compaction advice", limits: "Usage limits" };
      var hint = document.getElementById("svc-hint");
      if (!sv) {
        c.appendChild(el("p", "empty-note", "Service status shows here while agent-services is running."));
        return;
      }
      var on = 0, total = 0;
      // "incidents" is not listed: no plugin code sends problem reports yet, so its switch would change nothing
      Object.keys(sv).filter(function (k) { return k !== "incidents"; }).sort(function (a, b) { return (names[a] ? 0 : 1) - (names[b] ? 0 : 1) || a.localeCompare(b); }).forEach(function (k) {
        var s = sv[k] || {};
        total++;
        var state = !s.on ? "off" : (s.healthy === false ? "warn" : "ok");
        if (s.on) { on++; }
        var chip = explainable(el("span", "chip " + state), "svc-" + k);
        var label = names[k] || (k.charAt(0).toUpperCase() + k.slice(1).replace(/_/g, " "));
        add(chip, el("span", "dot"), label, el("span", "st", state === "off" ? "off" : state === "warn" ? "paused" : "on"));
        c.appendChild(chip);
      });
      hint.textContent = on + " of " + total + " on";
      explainable(hint, "svc-count");
      document.getElementById("svc-how").appendChild(how("Read from agent-services on this computer when this page was made. " +
        "“Paused” means a service is switched on but is not reaching our service right now, for example while offline or signed out.", true));
    })();

    // ---------------------------------------------------------------- footer
    (function footer() {
      var f = document.getElementById("footer");
      var parts = [];
      if (act && act.first_seen) { parts.push("With you since " + fmtDay(act.first_seen, true)); }
      if (typeof D.generated_at === "string") {
        var t = new Date(D.generated_at);
        if (!isNaN(t.getTime())) { parts.push("Updated " + t.toLocaleString("en-US", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" })); }
      }
      parts.push("This page shows counts and amounts only, never your work.");
      f.textContent = parts.join(" · ");
    })();
    return true;
  }

  // ---------------------------------------------------------------- figures
  // The figures baked into the page first; then the artifact's data document (board/figures), which the plugin
  // updates without publishing the page again, when its figures are newer. Without db the baked figures stay.
  draw(shown);
  function stamp(d) { var t = d && (d.generated_at || d.at); return typeof t === "string" ? t : ""; }
  var newest = stamp(shown); // only newer figures replace the ones shown
  try {
    var cl = window.claude;
    if (cl && typeof cl.use === "function") {
      cl.use("db").then(function (db) {
        if (!db) { return; }
        db.doc("board/figures").onSnapshot(function (snap) {
          var d = snap && snap.exists ? snap.data() : null;
          if (!d || typeof d !== "object" || stamp(d) <= newest) { return; }
          if (draw(d)) { newest = stamp(d); }
        }, function () { /* the figures shown stay */ });
      }, function () { /* the figures shown stay */ });
    }
  } catch (e) { /* the figures shown stay */ }
})();
</script>
</body>
</html>
